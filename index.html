<script>
// Shared state. Remote = Google Apps Script. Local = localStorage (testing on one computer).
(function(){
  const C = window.RADAR;
  const remote = !!C.ENDPOINT;
  const BLANK = () => ({stage:"factor", q:0, bossView:1, round:0, phase:"lobby", openAt:0, seconds:C.SECONDS, v:0, scores:{1:0,2:0,3:0,4:0}, awards:{}});
  async function call(params){
    const u = C.ENDPOINT + (C.ENDPOINT.includes("?")?"&":"?") + new URLSearchParams(params).toString() + "&_=" + Date.now();
    const r = await fetch(u, {redirect:"follow"});
    return r.json();
  }
  const L = {
    get(){ return {state: JSON.parse(localStorage.getItem("br_state")||"null")||BLANK(), answers: JSON.parse(localStorage.getItem("br_answers")||"{}")}; }
  };
  window.Store = {
    blank: BLANK, remote,
    async get(){ if(remote){ const d = await call({a:"get"}); if(!d.state) d.state = BLANK(); d.answers = d.answers||{}; return d; } return L.get(); },
    async setState(st, answers){
      st.v = (st.v||0)+1;
      if(remote){ await call({a:"set", key:C.HOST_KEY, state:JSON.stringify(st), answers: answers?JSON.stringify(answers):""}); return; }
      localStorage.setItem("br_state", JSON.stringify(st));
      if(answers) localStorage.setItem("br_answers", JSON.stringify(answers));
    },
    async answer(key, team, data){
      if(remote){ return call({a:"put", k:key, team, d:JSON.stringify(data)}); }
      const d = L.get();
      if(d.state.phase!=="open") return {ok:false, msg:"closed"};
      if(Date.now() > d.state.openAt + d.state.seconds*1000 + 3000) return {ok:false, msg:"time"};
      d.answers[key] = d.answers[key]||{};
      d.answers[key][team] = Object.assign({}, data, {t:Date.now()});
      localStorage.setItem("br_answers", JSON.stringify(d.answers));
      return {ok:true};
    }
  };
})();

</script>

const SUN='<svg viewBox="0 0 100 100" width="100%" height="100%" aria-label="Sun of the Philippine flag"><g fill="#FCD116" stroke="#C9A400" stroke-width="1.5" stroke-linejoin="round"><polygon points="50,2 57,24 43,24" transform="rotate(0 50 50)"/><polygon points="50,2 57,24 43,24" transform="rotate(45 50 50)"/><polygon points="50,2 57,24 43,24" transform="rotate(90 50 50)"/><polygon points="50,2 57,24 43,24" transform="rotate(135 50 50)"/><polygon points="50,2 57,24 43,24" transform="rotate(180 50 50)"/><polygon points="50,2 57,24 43,24" transform="rotate(225 50 50)"/><polygon points="50,2 57,24 43,24" transform="rotate(270 50 50)"/><polygon points="50,2 57,24 43,24" transform="rotate(315 50 50)"/><circle cx="50" cy="50" r="22"/></g></svg>', PAROL='<svg viewBox="0 0 200 300" width="100%" height="100%" aria-label="Parol, a Filipino star lantern"><line x1="100" y1="0" x2="100" y2="22" stroke="#0038A8" stroke-width="3"/><polygon points="100.0,24.0 116.8,71.3 162.2,49.8 140.7,95.2 188.0,112.0 140.7,128.8 162.2,174.2 116.8,152.7 100.0,200.0 83.2,152.7 37.8,174.2 59.3,128.8 12.0,112.0 59.3,95.2 37.8,49.8 83.2,71.3" fill="#FCD116" stroke="#C9A400" stroke-width="3" stroke-linejoin="round"/><polygon points="123.7,54.7 122.6,89.4 157.3,88.3 132.0,112.0 157.3,135.7 122.6,134.6 123.7,169.3 100.0,144.0 76.3,169.3 77.4,134.6 42.7,135.7 68.0,112.0 42.7,88.3 77.4,89.4 76.3,54.7 100.0,80.0" fill="#CE1126" stroke="#8E0C1A" stroke-width="2.5" stroke-linejoin="round"/><polygon points="100.0,74.0 107.7,93.5 126.9,85.1 118.5,104.3 138.0,112.0 118.5,119.7 126.9,138.9 107.7,130.5 100.0,150.0 92.3,130.5 73.1,138.9 81.5,119.7 62.0,112.0 81.5,104.3 73.1,85.1 92.3,93.5" fill="#fff" stroke="#0038A8" stroke-width="2.5" stroke-linejoin="round"/><circle cx="100" cy="112" r="13" fill="#0038A8"/><polygon points="55,200 73,200 28,290" fill="#0038A8" stroke="#0A2463" stroke-width="2" stroke-linejoin="round"/><polygon points="73,200 91,200 64,290" fill="#CE1126" stroke="#8E0C1A" stroke-width="2" stroke-linejoin="round"/><polygon points="91,200 109,200 100,290" fill="#FCD116" stroke="#C9A400" stroke-width="2" stroke-linejoin="round"/><polygon points="109,200 127,200 136,290" fill="#CE1126" stroke="#8E0C1A" stroke-width="2" stroke-linejoin="round"/><polygon points="127,200 145,200 172,290" fill="#0038A8" stroke="#0A2463" stroke-width="2" stroke-linejoin="round"/></svg>', SAMP='<svg viewBox="0 0 240 36" width="100%" height="100%" aria-label="Sampaguita flowers"><path d="M0,18 Q60,6 120,18 T240,18" fill="none" stroke="#7BAA5E" stroke-width="2"/><ellipse cx="24" cy="8" rx="6" ry="11" transform="rotate(0 24 18)" fill="#fff" stroke="#C9C2A0" stroke-width="1"/><ellipse cx="24" cy="8" rx="6" ry="11" transform="rotate(72 24 18)" fill="#fff" stroke="#C9C2A0" stroke-width="1"/><ellipse cx="24" cy="8" rx="6" ry="11" transform="rotate(144 24 18)" fill="#fff" stroke="#C9C2A0" stroke-width="1"/><ellipse cx="24" cy="8" rx="6" ry="11" transform="rotate(216 24 18)" fill="#fff" stroke="#C9C2A0" stroke-width="1"/><ellipse cx="24" cy="8" rx="6" ry="11" transform="rotate(288 24 18)" fill="#fff" stroke="#C9C2A0" stroke-width="1"/><circle cx="24" cy="18" r="3.5" fill="#FCD116"/><ellipse cx="72" cy="8" rx="6" ry="11" transform="rotate(0 72 18)" fill="#fff" stroke="#C9C2A0" stroke-width="1"/><ellipse cx="72" cy="8" rx="6" ry="11" transform="rotate(72 72 18)" fill="#fff" stroke="#C9C2A0" stroke-width="1"/><ellipse cx="72" cy="8" rx="6" ry="11" transform="rotate(144 72 18)" fill="#fff" stroke="#C9C2A0" stroke-width="1"/><ellipse cx="72" cy="8" rx="6" ry="11" transform="rotate(216 72 18)" fill="#fff" stroke="#C9C2A0" stroke-width="1"/><ellipse cx="72" cy="8" rx="6" ry="11" transform="rotate(288 72 18)" fill="#fff" stroke="#C9C2A0" stroke-width="1"/><circle cx="72" cy="18" r="3.5" fill="#FCD116"/><ellipse cx="120" cy="8" rx="6" ry="11" transform="rotate(0 120 18)" fill="#fff" stroke="#C9C2A0" stroke-width="1"/><ellipse cx="120" cy="8" rx="6" ry="11" transform="rotate(72 120 18)" fill="#fff" stroke="#C9C2A0" stroke-width="1"/><ellipse cx="120" cy="8" rx="6" ry="11" transform="rotate(144 120 18)" fill="#fff" stroke="#C9C2A0" stroke-width="1"/><ellipse cx="120" cy="8" rx="6" ry="11" transform="rotate(216 120 18)" fill="#fff" stroke="#C9C2A0" stroke-width="1"/><ellipse cx="120" cy="8" rx="6" ry="11" transform="rotate(288 120 18)" fill="#fff" stroke="#C9C2A0" stroke-width="1"/><circle cx="120" cy="18" r="3.5" fill="#FCD116"/><ellipse cx="168" cy="8" rx="6" ry="11" transform="rotate(0 168 18)" fill="#fff" stroke="#C9C2A0" stroke-width="1"/><ellipse cx="168" cy="8" rx="6" ry="11" transform="rotate(72 168 18)" fill="#fff" stroke="#C9C2A0" stroke-width="1"/><ellipse cx="168" cy="8" rx="6" ry="11" transform="rotate(144 168 18)" fill="#fff" stroke="#C9C2A0" stroke-width="1"/><ellipse cx="168" cy="8" rx="6" ry="11" transform="rotate(216 168 18)" fill="#fff" stroke="#C9C2A0" stroke-width="1"/><ellipse cx="168" cy="8" rx="6" ry="11" transform="rotate(288 168 18)" fill="#fff" stroke="#C9C2A0" stroke-width="1"/><circle cx="168" cy="18" r="3.5" fill="#FCD116"/><ellipse cx="216" cy="8" rx="6" ry="11" transform="rotate(0 216 18)" fill="#fff" stroke="#C9C2A0" stroke-width="1"/><ellipse cx="216" cy="8" rx="6" ry="11" transform="rotate(72 216 18)" fill="#fff" stroke="#C9C2A0" stroke-width="1"/><ellipse cx="216" cy="8" rx="6" ry="11" transform="rotate(144 216 18)" fill="#fff" stroke="#C9C2A0" stroke-width="1"/><ellipse cx="216" cy="8" rx="6" ry="11" transform="rotate(216 216 18)" fill="#fff" stroke="#C9C2A0" stroke-width="1"/><ellipse cx="216" cy="8" rx="6" ry="11" transform="rotate(288 216 18)" fill="#fff" stroke="#C9C2A0" stroke-width="1"/><circle cx="216" cy="18" r="3.5" fill="#FCD116"/></svg>';
const brand=(sub)=>'<div class="brand"><span class="sunic">'+SUN+'</span><div><p class="eyebrow">'+sub+'</p><h1>Business Radar</h1></div></div>';
function runLanding(){
  $('#app').className='wrap';
  const base=location.href.split('#')[0];
  $('#app').innerHTML=brand('Applied Economics 12 · ABM')
   +'<div class="landing-art"><div class="p">'+PAROL+'</div><div><h2>Mabuhay!</h2><p class="big">PESTEL Factor Hunt. One tablet per team: the Recorder answers for the team.</p></div></div><div class="sampa">'+SAMP+'</div>'
   +'<div class="card" style="margin-top:1vh"><h3>Team tablet</h3><a href="#team" onclick="setTimeout(()=>location.reload(),50)"><button class="btn primary">Join as team</button></a></div>'
   +'<div class="card" style="margin-top:1vh"><h3>Teacher (TV screen)</h3><a href="#host" onclick="setTimeout(()=>location.reload(),50)"><button class="btn">Open host screen</button></a></div>'
   +'<p class="muted sm" style="margin-top:1vh">Tablets: '+base+'#team<br>Teacher: '+base+'#host</p>';
}
function runHost(){
$('#app').className='tv';
const N=RADAR.TEAMS; let S=null,A={},busy=false;
const fac=id=>FACTORS.find(x=>x.id===id);
const otName=o=>o==="O"?"Opportunity":"Threat";
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tm=s=>{s=Math.max(0,s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
const left=()=>Math.max(0,Math.ceil((S.openAt+S.seconds*1000-Date.now())/1000));
const SECS_Q=15, SECS_BOSS=240;
async function save(answers){ busy=true; try{ await Store.setState(S,answers); } finally { busy=false; } render(); }
function startRound(r){ S.stage='factor'; S.round=r; S.phase='ready'; S.openAt=0; save(); }
function openAnswers(secs){ S.phase='open'; S.openAt=Date.now(); S.seconds=secs||RADAR.SECONDS; save(); }
function lockNow(){ if(S.phase==='open'){ S.phase='locked'; save(); } }
function addAward(k,t,obj,pts){ S.awards[k]=S.awards[k]||{}; const old=S.awards[k][t]; if(old) S.scores[t]=(S.scores[t]||0)-(old.f||0)-(old.ot||0)-(old.exp||0)-(old.tw||0); S.awards[k][t]=obj; S.scores[t]=(S.scores[t]||0)+pts; }
async function reveal(){
  try{ const d=await Store.get(); A=d.answers; }catch(e){}
  if(S.stage==='lightning'){
    const q=S.q, k='q'+q, item=QUIZ[q-1];
    for(let t=1;t<=N;t++){ const a=(A[k]||{})[t]; const ok=!!a&&a.v===(item.a?'T':'F'); addAward(k,t,{f:ok?10:0,ot:0,exp:0,tw:0},ok?10:0); }
    S.phase='revealed'; save(); return;
  }
  const r=S.round, rd=ROUNDS[r-1], k='r'+r;
  for(let t=1;t<=N;t++){
    const a=(A[k]||{})[t]; const aw={f:0,ot:0,exp:0,tw:0};
    if(a){ if(a.f===rd.f) aw.f=10; if(rd.ok.includes(a.ot)) aw.ot=5; }
    addAward(k,t,aw,aw.f+aw.ot);
  }
  S.phase='revealed'; save();
}
function bonus(t,key){ const aw=S.awards['r'+S.round][t]; const on=aw[key]>0; aw[key]=on?0:5; S.scores[t]+=on?-5:5; save(); }
function startBoss(){ S.stage='boss'; S.phase='ready'; S.openAt=0; S.bossView=1; save(); }
async function presentBoss(){ try{ const d=await Store.get(); A=d.answers; }catch(e){} S.phase='present'; S.bossView=1; save(); }
function bossTeam(d){ S.bossView=Math.min(N,Math.max(1,(S.bossView||1)+d)); save(); }
function bossScore(t,key,val){ S.awards.boss=S.awards.boss||{}; const x=S.awards.boss[t]=S.awards.boss[t]||{c:0,e:0,r:0}; S.scores[t]=(S.scores[t]||0)+val-x[key]; x[key]=val; save(); }
function startQuiz(q){ S.stage='lightning'; S.q=q; S.phase='ready'; S.openAt=0; save(); }
let menuOpen=false;
function toggleMenu(){ menuOpen=!menuOpen; render(); }
function has(o){ return !!o && Object.keys(o).length>0; }
function go(stage,n,fresh){
  menuOpen=false; S.openAt=0;
  if(stage==='home'){ S.phase='lobby'; }
  else if(stage==='factor'){ S.stage='factor'; S.round=n; if(fresh) A['r'+n]={}; S.phase=(!fresh&&has(S.awards['r'+n]))?'revealed':'ready'; }
  else if(stage==='boss'){ S.stage='boss'; S.bossView=1; if(fresh) A.boss={}; S.phase=(!fresh&&has(A.boss))?'present':'ready'; }
  else if(stage==='lightning'){ S.stage='lightning'; S.q=n; if(fresh) A['q'+n]={}; S.phase=(!fresh&&has(S.awards['q'+n]))?'revealed':'ready'; }
  else if(stage==='final'){ S.stage='final'; S.phase='final'; }
  save(fresh?A:undefined);
}
function replay(){ const k=S.stage==='lightning'?'q'+S.q:S.stage==='boss'?'boss':'r'+S.round; A[k]={}; S.phase='ready'; S.openAt=0; save(A); }
function menuHTML(){
  const done=k=>has(S.awards[k])?' ✓':'';
  const cur=(st,n)=>((S.stage||'factor')===st&&S.phase!=='lobby'&&S.phase!=='final'&&(n==null||(st==='factor'?S.round===n:S.q===n)))?' primary':'';
  let h='<div class="ov"><div class="ovc"><h2 style="margin:0 0 1.2vh">Choose an activity</h2>';
  h+='<div class="ovr"><b>Home</b><button class="btn" onclick="go(\'home\')">Home screen</button></div>';
  h+='<div class="ovr"><b>Activity 1 · Factor Hunt</b><span>'+ROUNDS.map((r,i)=>'<button class="btn'+cur('factor',i+1)+'" onclick="go(\'factor\','+(i+1)+')">Round '+(i+1)+done('r'+(i+1))+'</button>').join('')+'</span></div>';
  h+='<div class="ovr"><b>Activity 2 · Boss Round</b><span><button class="btn'+cur('boss')+'" onclick="go(\'boss\',1)">Open Boss Round'+(has(S.awards.boss)?' ✓':'')+'</button><button class="btn" onclick="go(\'boss\',1,true)">Re-run (clear answers)</button></span></div>';
  h+='<div class="ovr"><b>Activity 3 · Lightning Round</b><span>'+QUIZ.map((r,i)=>'<button class="btn'+cur('lightning',i+1)+'" onclick="go(\'lightning\','+(i+1)+')">Item '+(i+1)+done('q'+(i+1))+'</button>').join('')+'</span></div>';
  h+='<div class="ovr"><b>Results</b><button class="btn" onclick="go(\'final\')">Final scores</button></div>';
  h+='<div class="ctrl"><button class="btn" onclick="toggleMenu()">Close</button></div></div></div>';
  return h;
}
function finish(){ S.stage='final'; S.phase='final'; save(); }
function resetAll(){ if(confirm('Reset all scores and answers?')){ S=Store.blank(); A={}; save({}); } }
function chipsIn(key){ return '<div class="chips">'+[...Array(N)].map((_,i)=>{const a=(A[key]||{})[i+1];return '<span class="chip'+(a?' in':'')+'">Team '+(i+1)+(a?' ✓':' …')+'</span>';}).join('')+'</div>'; }
function timerBlock(key){ return '<div class="tline"><div class="timer" id="tm">'+tm(left())+'</div>'+chipsIn(key)+'</div>'; }
function tagHTML(f){ return '<span class="tag" style="background:'+f.color+';border-color:'+f.line+';color:'+f.text+'">'+f.letter+'</span>'; }
function factorView(){
  const r=S.round, rd=ROUNDS[r-1], ph=S.phase, f=fac(rd.f); let h='', side='';
  if(ph==='revealed'){
    h+='<div class="card" style="background:'+f.tint+';border-color:'+f.line+'"><p class="eyebrow">Answer</p><h2>'+f.letter+' · '+f.name+' ('+f.fil+') · '+rd.ok.map(otName).join(' or ')+'</h2><p class="scen" style="font-size:28px">'+rd.why+'</p></div>';
  } else h+='<div class="card"><p class="eyebrow">Scenario</p><p class="scen">'+rd.scenario+'</p></div>';
  if(ph==='ready') h+='<p class="muted" style="font-size:24px;margin:0">Read the scenario aloud, then open answers.</p>';
  if(ph==='open'||ph==='locked') h+=timerBlock('r'+r);
  if(ph==='revealed'){
    h+='<div class="chips rev">'+[...Array(N)].map((_,i)=>{const t=i+1,a=(A['r'+r]||{})[t],aw=(S.awards['r'+r]||{})[t]||{f:0,ot:0,exp:0,tw:0};
      const tag=a?tagHTML(fac(a.f))+' '+otName(a.ot):'no answer';
      return '<div class="chip"><div class="ans">Team '+t+': '+tag+' '+(aw.f?'<span class="ok">✓</span>':'<span class="no">✗</span>')+'</div><div class="awardrow">+'+(aw.f+aw.ot)+' XP</div><div class="awardrow"><button class="btn" onclick="bonus('+t+',\'exp\')">'+(aw.exp?'✓ ':'')+'+5 explained</button><button class="btn" onclick="bonus('+t+',\'tw\')">'+(aw.tw?'✓ ':'')+'+5 teamwork</button></div></div>';}).join('')+'</div>';
    side='<div class="card news" style="margin-top:1.2vh"><p class="eyebrow">Trending now</p>'+rd.news+'<p class="muted sm">Source: '+rd.src+'</p></div>';
  }
  h+='<div class="ctrl">';
  if(ph==='ready') h+='<button class="btn primary" onclick="openAnswers('+RADAR.SECONDS+')">Open answers ('+RADAR.SECONDS+'s)</button>';
  if(ph==='open') h+='<button class="btn" onclick="lockNow()">Lock now</button>';
  if(ph==='locked') h+='<button class="btn primary" onclick="reveal()">Reveal answer</button>';
  if(ph==='revealed') h+= (r<ROUNDS.length ? '<button class="btn primary" onclick="startRound('+(r+1)+')">Next: Round '+(r+1)+'</button>' : '<button class="btn primary" onclick="startBoss()">Next: Boss Round</button>')+'<button class="btn" onclick="replay()">Replay</button>';
  return {h:h+'</div>',side};
}
function bossView(){
  const ph=S.phase; let h='', side='';
  if(ph==='ready'){
    h+='<div class="card"><h2>Boss Round: Business Radar Report</h2><p class="scen" style="font-size:clamp(15px,2.8vh,28px)">Each team gets a business card. On your tablet: fill the PESTEL grid, mark each factor Opportunity or Threat, write one recommendation, and let the Researcher add one source. You have 4 minutes.</p></div>';
    h+='<div class="chips">'+CARDS.slice(0,N).map((c,i)=>'<span class="chip">Team '+(i+1)+' → Card '+c.id+': '+c.biz+'</span>').join('')+'</div>';
    h+='<div class="ctrl"><button class="btn primary" onclick="openAnswers('+SECS_BOSS+')">Start Boss Round (4:00)</button></div>';
  } else if(ph==='open'||ph==='locked'){
    h+='<div class="card"><p class="eyebrow">Boss Round</p><p class="scen">Fill the PESTEL grid for your card. One recommendation. Researcher: add a source.</p></div>'+timerBlock('boss');
    h+='<div class="ctrl">'+(ph==='open'?'<button class="btn" onclick="lockNow()">Lock now</button>':'<button class="btn primary" onclick="presentBoss()">Present teams</button>')+'</div>';
  } else {
    const t=S.bossView||1, c=CARDS[t-1], a=(A.boss||{})[t]||{rows:{}}, aw=(S.awards.boss||{})[t]||{c:0,e:0,r:0};
    h+='<div class="card"><p class="eyebrow">Team '+t+' · Card '+c.id+' · '+c.biz+'</p>'+FACTORS.map(f=>{const r=(a.rows&&a.rows[f.id])||{};return '<div class="brow">'+tagHTML(f)+'<span class="btxt">'+esc(r.t||'—')+'</span><span class="otp">'+(r.ot?otName(r.ot):'—')+'</span></div>';}).join('')+'</div>';
    h+='<div class="card"><p class="scen" style="font-size:clamp(14px,2.7vh,26px);margin:0"><b>Recommendation:</b> '+esc(a.rec||'—')+'<br><span class="muted">Source: '+esc(a.src||'—')+'</span></p></div>';
    h+='<div class="ctrl"><button class="btn" onclick="bossTeam(-1)"'+(t<=1?' disabled':'')+'>◀ Previous team</button>'+(t<N?'<button class="btn primary" onclick="bossTeam(1)">Next team ▶</button>':'<button class="btn primary" onclick="startQuiz(1)">Next: Lightning Round</button>')+'</div>';
    const rows=[['c','Factors classified correctly'],['e','Effect explained (opportunity or threat)'],['r','Realistic recommendation and teamwork']];
    side='<div class="card" style="margin-top:1.2vh"><h3>Rubric: Team '+t+' ('+(aw.c+aw.e+aw.r)+'/30)</h3>'+rows.map(([k,l])=>'<div class="rub"><span>'+l+'</span><span>'+[0,5,10].map(v=>'<button class="btn'+(aw[k]===v?' sel':'')+'" onclick="bossScore('+t+',\''+k+'\','+v+')">'+v+'</button>').join('')+'</span></div>').join('')+'</div>';
  }
  return {h,side};
}
function quizView(){
  const q=S.q, it=QUIZ[q-1], ph=S.phase; let h='', side='';
  h+='<div class="card" style="'+(ph==='revealed'?'background:'+(it.a?'#DCE6FA':'#FADADD')+';border-color:'+(it.a?'#0038A8':'#CE1126'):'')+'"><p class="eyebrow">Statement '+q+' of '+QUIZ.length+'</p><p class="scen">'+it.q+'</p>'+(ph==='revealed'?'<h2 style="margin-top:1vh">'+(it.a?'TRUE':'FALSE')+'</h2><p class="scen" style="font-size:clamp(14px,2.7vh,26px)">'+it.why+'</p>':'')+'</div>';
  if(ph==='open'||ph==='locked') h+=timerBlock('q'+q);
  if(ph==='revealed'){
    h+='<div class="chips rev">'+[...Array(N)].map((_,i)=>{const t=i+1,a=(A['q'+q]||{})[t],aw=(S.awards['q'+q]||{})[t]||{f:0};
      return '<div class="chip"><div class="ans">Team '+t+': '+(a?(a.v==='T'?'True':'False'):'no answer')+' '+(aw.f?'<span class="ok">✓</span>':'<span class="no">✗</span>')+'</div><div class="awardrow">+'+aw.f+' XP</div></div>';}).join('')+'</div>';
  }
  h+='<div class="ctrl">';
  if(ph==='ready') h+='<button class="btn primary" onclick="openAnswers('+SECS_Q+')">Open answers ('+SECS_Q+'s)</button>';
  if(ph==='open') h+='<button class="btn" onclick="lockNow()">Lock now</button>';
  if(ph==='locked') h+='<button class="btn primary" onclick="reveal()">Reveal answer</button>';
  if(ph==='revealed') h+= (q<QUIZ.length ? '<button class="btn primary" onclick="startQuiz('+(q+1)+')">Next statement</button>' : '<button class="btn primary" onclick="finish()">Show final scores</button>')+'<button class="btn" onclick="replay()">Replay</button>';
  return {h:h+'</div>',side};
}
function render(){
  if(!S) return;
  const st=S.stage||'factor', ph=S.phase;
  const label = ph==='lobby'?'' : st==='factor'?' · Round '+S.round+' of '+ROUNDS.length : st==='boss'?' · Boss Round' : st==='lightning'?' · Lightning Round' : '';
  let h='<div class="top">'+brand('Applied Economics 12 · PESTEL'+label)+'<span class="parolic">'+PAROL+'</span><div class="muted sm" style="margin-right:6vw">'+(Store.remote?'Online mode':'Test mode (one computer)')+' · <a href="#team" target="_blank">team page</a></div></div>';
  h+='<div class="layout"><div>';
  let side='';
  if(ph==='lobby'){
    h+='<div class="card"><h2>Handa na? Ready to play</h2><p class="scen">Teams: open the team link (index.html#team) on your tablet and choose your team.</p><div class="ctrl"><button class="btn primary" onclick="startRound(1)">Start Round 1</button></div></div>';
  } else if(ph==='final'||st==='final'){
    const rows=Object.entries(S.scores).sort((a,b)=>b[1]-a[1]);
    h+='<div class="card"><h2>Mabuhay! Final scores</h2><p class="scen">'+rows.map(([t,s],i)=>(i+1)+'. Team '+t+' · <b>'+s+' XP</b>').join('<br>')+'</p></div>';
  } else {
    const v = st==='boss'?bossView(): st==='lightning'?quizView(): factorView();
    h+=v.h; side=v.side||'';
  }
  h+='<div class="ctrl"><button class="btn sm primary" onclick="toggleMenu()">☰ Menu</button><button class="btn sm" onclick="resetAll()">Reset game</button></div></div>';
  const rows=[...Array(N)].map((_,i)=>[i+1,S.scores[i+1]||0]).sort((a,b)=>b[1]-a[1]);
  h+='<div><div class="card"><h3>Scoreboard (XP)</h3><table class="score"><tr><th>Team</th><th class="r">XP</th></tr>'+rows.map(([t,s])=>'<tr'+(s>0&&s===rows[0][1]?' class="lead"':'')+'><td>Team '+t+(s>0&&s===rows[0][1]?' ★':'')+'</td><td class="r"><b>'+s+'</b></td></tr>').join('')+'</table></div>'+side+'</div></div>';
  if(menuOpen) h+=menuHTML();
  $('#app').innerHTML=h;
}
function tick(){
  if(!S||S.phase!=='open') return;
  const l=left(), el=$('#tm'); if(el) el.textContent=tm(l);
  if(l<=0 && !busy) lockNow();
}
async function poll(){
  if(busy) return;
  try{
    const d=await Store.get();
    if(!S){ S=d.state; A=d.answers; render(); return; }
    const before=JSON.stringify(A); A=d.answers;
    if(JSON.stringify(A)!==before) render();
  }catch(e){}
}
Object.assign(window,{go,replay,toggleMenu,startRound,openAnswers,lockNow,reveal,bonus,startBoss,presentBoss,bossTeam,bossScore,startQuiz,finish,resetAll});
poll(); setInterval(poll,1500); setInterval(tick,250);
}

function runTeam(){
$('#app').className='wrap';
const TS = Store.remote ? localStorage : sessionStorage;
let team = TS.getItem('br_team');
let sel={f:null,ot:null}, draft=null, cur=null, key='', sentMsg='', home=false, rev=null, hmsg='';
const fac=id=>FACTORS.find(x=>x.id===id);
const otN=o=>o==='O'?'Opportunity':'Threat';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tm=s=>{s=Math.max(0,s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
const leftS=()=>cur?Math.max(0,Math.ceil((cur.state.openAt+cur.state.seconds*1000-Date.now())/1000)):0;
const mkDraft=()=>({rows:Object.fromEntries(FACTORS.map(f=>[f.id,{t:'',ot:null}])),rec:'',src:''});
function pickTeam(){
  $('#app').innerHTML='<p class="eyebrow">Business Radar</p><h1>Choose your team</h1><p class="muted">Only the Recorder uses this tablet.</p><div class="teams">'+[1,2,3,4].map(n=>'<button class="btn" data-t="'+n+'">Team '+n+'</button>').join('')+'</div>';
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{team=b.dataset.t;TS.setItem('br_team',team);render();});
}
const head=()=>'<div style="display:flex;justify-content:space-between;align-items:center"><span style="display:flex;gap:8px;align-items:center"><span class="pill">Team '+team+'</span><button class="btn'+(home?' primary':'')+'" id="hm" style="font-size:14px;padding:6px 12px">🏠 Home</button></span><button class="btn" id="chg" style="font-size:14px;padding:6px 12px">Change team</button></div>';
const has2=o=>!!o&&Object.keys(o).length>0;
function actNow(){ const st=cur.state, ph=st.phase; if(ph==='lobby') return 0; if(ph==='final'||st.stage==='final') return 4; const s2=st.stage||'factor'; return s2==='factor'?1:s2==='boss'?2:3; }
const ACTN=['','Activity 1 · Factor Hunt','Activity 2 · Boss Round','Activity 3 · Lightning Round'];
function homeV(){
  const st=cur.state, now=actNow();
  const card=(i,sub)=>{ const lv=now===i, dn=now>i; return '<button class="btn hb'+(lv?' primary':'')+'" data-go="'+i+'" style="width:100%;margin-top:8px;padding:14px"><span style="font-size:20px">'+ACTN[i]+'</span><small style="font-size:13px">'+(lv?'LIVE NOW · tap to join':dn?'Finished':'Not open yet')+'</small></button>'; };
  let h='<h2 style="margin:14px 0 4px">Home</h2><p class="muted" style="margin:0">'+(now===0?'Waiting for your teacher to start.':now===4?'The game is finished.':'Tap the live activity to join what your teacher is showing.')+'</p>';
  h+=card(1)+card(2)+card(3);
  h+='<div class="card" style="margin-top:10px"><p class="big" style="margin:0">Team total: <b>'+(st.scores[team]||0)+' XP</b></p></div>';
  h+='<p class="muted" id="hmsg" style="margin:8px 0 0">'+esc(hmsg)+'</p>';
  return h;
}
function view(){
  if(home) return homeV();
  const {state,answers}=cur, st=state.stage||'factor', ph=state.phase;
  if(ph==='lobby') return '<h2 style="margin-top:20px">Handa na ba kayo?</h2><p class="big">Get ready. Waiting for the teacher to start Round 1.</p><div class="sampa">'+SAMP+'</div>';
  if(ph==='final'||st==='final'){
    const rows=Object.entries(state.scores).sort((a,b)=>b[1]-a[1]);
    return '<h2 style="margin-top:20px">Mabuhay! Final scores</h2><div class="card" style="margin-top:10px">'+rows.map(([t,s],i)=>'<p class="big">'+(i+1)+'. Team '+t+': <b>'+s+' XP</b></p>').join('')+'</div>';
  }
  if(ph==='ready') return '<p class="eyebrow" style="margin-top:14px">'+(st==='factor'?'Round '+state.round+' of '+ROUNDS.length:st==='boss'?'Boss Round':'Lightning Round')+'</p><h2>Listen to the teacher</h2><p class="big">Look at the TV. Answers open in a moment.</p>';
  if(st==='factor') return factorV(state,answers,ph);
  if(st==='boss') return bossV(state,answers,ph);
  return quizV(state,answers,ph);
}
function factorV(state,answers,ph){
  const r=state.round, rd=ROUNDS[r-1], f=fac(rd.f), mine=(answers['r'+r]||{})[team];
  let h='<p class="eyebrow" style="margin-top:14px">Round '+r+' of '+ROUNDS.length+'</p>';
  if(ph==='open'){
    const l=leftS();
    h+='<div class="card" style="margin-top:6px"><p class="big" style="margin:0">'+rd.scenario+'</p></div>';
    h+='<p class="muted" style="margin:10px 0 0">Time left: <b id="tl">'+l+'s</b>. 1) Pick the factor.</p><div class="grid6">'+FACTORS.map(x=>'<button class="fbtn'+(sel.f===x.id?' sel':'')+'" data-f="'+x.id+'" style="background:'+x.color+';border-color:'+x.line+';color:'+x.text+'"><div class="l">'+x.letter+'</div><div class="n">'+x.name+'</div></button>').join('')+'</div>';
    h+='<p class="muted" style="margin:14px 0 0">2) Opportunity or threat?</p><div class="ot"><button class="btn'+(sel.ot==='O'?' sel':'')+'" data-o="O">Opportunity</button><button class="btn'+(sel.ot==='T'?' sel':'')+'" data-o="T">Threat</button></div>';
    h+='<button class="btn primary" id="send" style="width:100%;margin-top:14px"'+((sel.f&&sel.ot)?'':' disabled')+'>Send answer</button><p class="ok" id="msg" style="margin:6px 0 0">'+(mine?'Sent: '+fac(mine.f).name+' · '+otN(mine.ot)+'. You may change it before time is up.':sentMsg)+'</p>';
  } else if(ph==='locked'){
    h+='<div class="card" style="margin-top:6px"><p class="big" style="margin:0">'+rd.scenario+'</p></div><h3 style="margin-top:16px">Time is up</h3><p class="big">'+(mine?'Your answer was sent. Waiting for the reveal.':'No answer was sent.')+'</p>';
  } else {
    const aw=(state.awards['r'+r]||{})[team]||{f:0,ot:0,exp:0,tw:0}, total=aw.f+aw.ot+aw.exp+aw.tw;
    h+='<div class="card" style="margin-top:6px;background:'+f.tint+';border-color:'+f.line+'"><p class="eyebrow">Correct answer</p><h2>'+f.name+' · '+rd.ok.map(otN).join(' or ')+'</h2><p class="big">'+rd.why+'</p></div>';
    h+='<div class="card" style="margin-top:12px"><p class="big" style="margin:0">'+(aw.f?'<b class="ok">Tama!</b> ':'<b class="no">Mali.</b> ')+(mine?('You chose <b>'+fac(mine.f).name+'</b> · '+otN(mine.ot)+'. '):'No answer sent. ')+'<br>Round XP: <b>'+total+'</b> · Team total: <b>'+(state.scores[team]||0)+' XP</b></p></div>';
  }
  return h;
}
function bossV(state,answers,ph){
  const c=CARDS[(+team||1)-1], mine=(answers.boss||{})[team];
  if(ph==='open'){
    if(!draft) draft=(mine&&mine.rows)?{rows:mine.rows,rec:mine.rec||'',src:mine.src||''}:mkDraft();
    let h='<div class="bhead"><span class="eyebrow">Boss Round · Card '+c.id+' · '+c.biz+'</span><b id="tl" class="timer2">'+tm(leftS())+'</b></div>';
    h+='<div class="card bfacts">'+c.facts.join(' · ')+'</div><div class="bform">';
    h+=FACTORS.map(f=>{const r=draft.rows[f.id];return '<div class="brow"><span class="tag" style="background:'+f.color+';border-color:'+f.line+';color:'+f.text+'">'+f.letter+'</span><input class="inp" data-r="'+f.id+'" maxlength="60" placeholder="'+f.name+': what is happening?" value="'+esc(r.t)+'"><button class="ob'+(r.ot==='O'?' sel':'')+'" data-bo="'+f.id+':O">O</button><button class="ob'+(r.ot==='T'?' sel':'')+'" data-bo="'+f.id+':T">T</button></div>';}).join('');
    h+='<input class="inp" id="rec" maxlength="160" placeholder="Recommendation to the owner" value="'+esc(draft.rec)+'"><input class="inp" id="src" maxlength="60" placeholder="Researcher: source (news site)" value="'+esc(draft.src)+'"></div>';

}
function quizV(state,answers,ph){
  const q=state.q, it=QUIZ[q-1], mine=(answers['q'+q]||{})[team];
  let h='<p class="eyebrow" style="margin-top:14px">Lightning Round · '+q+' of '+QUIZ.length+'</p><div class="card" style="margin-top:6px"><p class="big" style="margin:0">'+it.q+'</p></div>';
  if(ph==='open'){
    h+='<p class="muted" style="margin:10px 0 0">Time left: <b id="tl">'+leftS()+'s</b>. Tap your answer.</p><div class="tf"><button class="btn tfb'+(sel.v==='T'?' sel':'')+'" data-v="T" style="--c:#0038A8">TRUE</button><button class="btn tfb'+(sel.v==='F'?' sel':'')+'" data-v="F" style="--c:#CE1126">FALSE</button></div><p class="ok" id="msg">'+(mine?'Sent: '+(mine.v==='T'?'True':'False')+'. You may change it before time is up.':sentMsg)+'</p>';
  } else if(ph==='locked'){
    h+='<h3 style="margin-top:16px">Time is up</h3><p class="big">'+(mine?'Your answer was sent.':'No answer was sent.')+'</p>';

  }
  return h;

function render(){
  if(!team) return pickTeam();

  document.querySelectorAll('[data-r]').forEach(i=>i.oninput=()=>{draft.rows[i.dataset.r].t=i.value;});

  const bs=$('#bsend'); if(bs) bs.onclick=async()=>{ bs.disabled=true; const r=await Store.answer('boss',team,{rows:draft.rows,rec:draft.rec,src:draft.src}); sentMsg=r&&r.ok===false?'Not sent (time is up).':'Sent ✓'; const m=$('#msg'); if(m) m.textContent=sentMsg; bs.disabled=false; };
}
async function poll(){
  try{

setInterval(()=>{ const el=$('#tl'); if(el&&cur&&cur.state.phase==='open'){ const l=leftS(); el.textContent=(cur.state.stage==='boss')?tm(l):l+'s'; } },400);

}
